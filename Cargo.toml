[workspace]
members = ["bsan-driver", "bsan-rt", "bsan-script", "cargo-bsan"]
default-members = ["bsan-driver", "bsan-script", "cargo-bsan"]
exclude = ["tests/test-cargo-bsan"]
resolver = "3"

[package]
name = "bsan"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
colored = "3"
ui_test = "0.30.2"
rustc_version = "0.4"
regex = "1.12.2"
tempfile = "3"

[[test]]
name = "ui"
harness = false
