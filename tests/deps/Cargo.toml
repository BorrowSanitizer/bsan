[package]
authors = ["BorrowSanitizer Team"]
description = "dependencies that unit tests can have"
license = "MIT OR Apache-2.0"
name = "bsan-test-deps"
repository = "https://github.com/borrowsanitizer/rust"
version = "0.1.0"
edition = "2021"

[dependencies]
hashbrown = "0.15.4"
libc = "0.2.174"
bzip2 = { version = "=0.6.0", features = ["bzip2-sys", "static"]}
flate2 = { version = "=1.0.28", features = ["zlib"], default-features = false }
klu-rs = "=0.4.0"
lcms2 = "=6.0.0"
blitsort-sys = "=0.1.0"
librsync = "=0.2.3"
dec = { version = "=0.4.8", default-features = false }

# Make sure we are not part of the rustc workspace.
[workspace]
