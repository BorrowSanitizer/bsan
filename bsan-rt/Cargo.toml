[package]
name = "bsan_rt"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = { version = "0.2.189", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "nightly", "inline-more"] }
rustc-hash = { version = "2.1.3", default-features = false }
libc-print = { version = "0.5.0" }
spin = "0.12.3"
smallvec = "1.16.1"
bitflags = "2.13.2"

[lib]
name = "bsan_rt"
crate-type = ["staticlib"]

[features]
default = ["pic", "lazy", "debug"]
pic = []
debug = []
expensive-consistency-checks = []
lazy = []
eager = []
smallvec-valmap = []
