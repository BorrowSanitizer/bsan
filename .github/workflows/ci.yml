name: CI
permissions:
  contents: read
  packages: read
on:
  push:
    branches: [ "main", "experimental" ]
  pull_request:
    branches: [ "main", "experimental" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: '${{ matrix.config.os }}'
    container:
      # `experimental` uses a different toolchain than `main`, so it has an
      # image of its own (see image.yml). A pull request uses its target's.
      image: ghcr.io/borrowsanitizer/bsan:${{ (github.base_ref || github.ref_name) == 'experimental' && 'experimental' || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    name: '${{ matrix.config.target }}'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup dependencies
      run: |
        ln -s /root/.rustup/ $HOME/.rustup
    - name: CI
      run: ./xb ci --allow-unsafe-deps