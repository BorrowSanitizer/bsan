name: Benchmark history cleanup
# Keeps gh-pages small: each benchmark run commits a large data file, so its
# full history would be GBs. Deletes the pages of branches that no longer
# exist (branches/<branch>/ and branches/<branch>-vs-<baseline>/, see
# bench-branch.yml), then squashes everything after the `gh-pages-base` tag,
# which preserves the history of the dashboard itself, into one commit.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bench-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    name: Clean up gh-pages
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Prune and squash gh-pages
      env:
        PAGES: ${{ runner.temp }}/pages
      run: |
        set -euo pipefail
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
        owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
        root="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
        script="$GITHUB_WORKSPACE/bsan-script/etc/bench-branch/branch_pages.sh"

        # A benchmark run may publish to gh-pages meanwhile; the push is leased
        # on the tip we started from, so it fails rather than drop that run's
        # commit, and we start over from the newer gh-pages. Only the push is
        # retried; any other failure stops the run.
        for attempt in 1 2 3 4 5; do
          git fetch --quiet --force origin \
            +refs/heads/gh-pages:refs/remotes/origin/gh-pages \
            +refs/tags/gh-pages-base:refs/tags/gh-pages-base
          base=$(git rev-parse 'gh-pages-base^{commit}')
          tip=$(git rev-parse origin/gh-pages)
          if ! git merge-base --is-ancestor "$base" "$tip"; then
            echo "::error::gh-pages-base is not an ancestor of gh-pages."
            exit 1
          fi
          rm -rf "$PAGES"
          git worktree prune
          git worktree add --quiet --detach "$PAGES" "$tip"
          # Listed afresh each attempt, so a branch created meanwhile is kept.
          heads=$(git ls-remote --heads origin)
          mapfile -t branches < <(sed 's|.*refs/heads/||' <<< "$heads")
          bash "$script" prune "$PAGES" "${branches[@]}"
          bash "$script" index "$PAGES" "$root"
          git -C "$PAGES" add -A
          tree=$(git -C "$PAGES" write-tree)
          tip_tree=$(git rev-parse "$tip^{tree}")
          count=$(git rev-list --count "$base..$tip")
          if [ "$tree" = "$tip_tree" ] && [ "$count" -le 1 ]; then
            echo "Nothing to clean up."
            exit 0
          fi
          squashed=$(git commit-tree "$tree" -p "$base" \
            -m "Benchmark results as of $(date -u +%Y-%m-%d)" \
            -m "Squashed $count commits after gh-pages-base.")
          if git push --quiet --force-with-lease="refs/heads/gh-pages:$tip" \
              origin "$squashed:refs/heads/gh-pages"; then
            exit 0
          fi
          echo "gh-pages moved while cleaning up; retrying ($attempt)"
          sleep $((attempt * 10))
        done
        echo "::error::Could not clean up gh-pages."
        exit 1
