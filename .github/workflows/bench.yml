name: Bench
on:
  schedule:
    - cron: '0 1/12 * * *'
  workflow_dispatch: 
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: '${{ matrix.config.os }}'
    container:
      image: ghcr.io/borrowsanitizer/bsan:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    name: '${{ matrix.config.target }}'
    steps:
    - uses: actions/checkout@v4
    - name: Setup dependencies
      run: |
        ln -s /root/.rustup/ $HOME/.rustup
        sudo apt-get update && sudo apt-get install -y hyperfine jq
    - name: Set output filename
      id: filename
      run: echo "results=results_$(date +%Y%m%d_%H%M%S)_${{ matrix.config.target }}.json" >> $GITHUB_OUTPUT
    - name: Benchmarks
      run: python3 ./bsan-script/etc/bench.py ./tests/benches/crates.json ${{ steps.filename.outputs.results }} ${{ matrix.config.target }}
    - uses: actions/upload-artifact@v4
      with:
        name: results_${{ matrix.config.target }}
        path: ${{ steps.filename.outputs.results }}
  merge:
    name: Merge & Upload
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: results_*
        merge-multiple: true
        path: results/
    - name: Merge JSON files
      run: |
        jq -s '[.[]]' results/*.json > results.json
    - name: Upload merged results
      uses: actions/upload-artifact@v4
      with:
        name: results
        path: results.json
        retention-days: 30