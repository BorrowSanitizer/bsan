name: Benchmarks
on:
  push:
    branches: [ "main" ]
    paths:
      - bsan-rt/**
      - bsan-pass/**
      - cargo-bsan/**
      - bsan-script/**
      - tests/benches/**
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  actions: write
  contents: write
  packages: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    name: Compute crate matrix
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.crates.outputs.crates }}
    steps:
    - uses: actions/checkout@v4
    - name: Read crate list from crates.json
      id: crates
      run: echo "crates=$(jq -c '[.[].name]' tests/benches/crates.json)" >> "$GITHUB_OUTPUT"
  bench:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
        crate: ${{ fromJson(needs.setup.outputs.crates) }}
    runs-on: ${{ matrix.config.os }}
    container:
      image: ghcr.io/borrowsanitizer/bsan:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    name: ${{ matrix.crate }} (${{ matrix.config.target }})
    steps:
    - uses: actions/checkout@v4
    - name: Setup dependencies
      run: |
        ln -s /root/.rustup/ $HOME/.rustup
        sudo apt-get update && sudo apt-get install -y hyperfine jq
    - name: Build and Install Latest Version
      run: ./xb install
    - name: Set output filename
      id: filename
      env:
        TARGET: ${{ matrix.config.target }}
        CRATE: ${{ matrix.crate }}
      run: echo "results=results_$(date +%Y-%m-%d_%H-%M-%S)_${TARGET}_${CRATE}" >> "$GITHUB_OUTPUT"
    - name: Benchmarks
      env:
        TARGET: ${{ matrix.config.target }}
        CRATE: ${{ matrix.crate }}
        RESULTS: ${{ steps.filename.outputs.results }}
      run: |
        python3 ./bsan-script/etc/bench.py \
        --crate "$CRATE" \
        ./tests/benches/crates.json \
        "$TARGET" \
        "$RESULTS.json" \
        "$RESULTS.csv"
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.filename.outputs.results }}
        path: |
          ${{ steps.filename.outputs.results }}.json
          ${{ steps.filename.outputs.results }}.csv
        retention-days: 30
  merge:
    name: Merge & Upload
    needs: bench
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: results_*
        merge-multiple: true
        path: results/
    - name: Set merged filename
      id: merged_filename
      run: echo "name=results_$(date +%Y-%m-%d_%H-%M-%S)" >> "$GITHUB_OUTPUT"
    - name: Merge JSON files
      run: jq -s 'add' results/*.json > ${{ steps.merged_filename.outputs.name }}.json
    - name: Upload merged results
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.merged_filename.outputs.name }}
        path: ${{ steps.merged_filename.outputs.name }}.json
        retention-days: 30
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        name: Benchmarks
        tool: 'customSmallerIsBetter'
        output-file-path: ${{ steps.merged_filename.outputs.name }}.json
        # Access token to deploy GitHub Pages branch
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Push and deploy GitHub pages branch automatically
        auto-push: true
        benchmark-data-dir-path: .
        fail-on-alert: true
        comment-on-alert: true
        alert-threshold: 150%
        alert-comment-cc-users: '@icmccorm,@mojeanmac'
